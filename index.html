      (locG[loc]||locG.castle).push(n);
    });

      const byL={};nodes.forEach(n=>{const k=n.type;(byL[k]=byL[k]||[]).push(n)});
      Object.entries(byL).forEach(([layer,lns])=>{
        const y=lY[layer]||0;
        const ringR=Math.max(1.5, lns.length*0.4);
        lns.forEach((n,i)=>{
          const ang=i*GA;
          p[n.id]=new THREE.Vector3(cx+Math.cos(ang)*ringR, y, Math.sin(ang)*ringR);
        });
      });
    });

  } else if(l==='pyramid'){
    // ─── KNOWLEDGE PYRAMID ───
    // X/Z plane = flat rings. L0 widest (r=10), L4 narrowest (r=1). Actual funnel shape.
    // Y = abstraction stepping upward. 2.5-unit gaps between layers.
    // Golden angle on each ring for even node spacing.
    const lY={L0:-6,L1:-3,L2:0,L3:3.5,L4:7.5,Entity:-1.5};
    const lR={L0:10,L1:7.5,L2:5,L3:2.8,L4:1,Entity:6.5};
    Object.entries(g).forEach(([k,nodes])=>{
      nodes.forEach((n,i)=>{
        const ang=i*GA, r=lR[k], y=lY[k];
        p[n.id]=new THREE.Vector3(Math.cos(ang)*r, y, Math.sin(ang)*r);
      });
    });

  } else if(l==='spiral'){
    // ─── TEMPORAL SPIRAL ───
    // X/Z plane = Archimedean spiral. Angle and radius grow with time.
    //   Early chapters near center, late chapters at edge.
    // Y = layer band. Each layer sits in its own horizontal plane, 2.5-unit gaps.
    // Each layer gets angular offset so same-time nodes don't overlap vertically.
    const lY={L0:0,L1:2.5,L2:-2.5,L3:-5,L4:-8,Entity:1};
    const lAng={L0:0,L1:0.5,L2:1.0,L3:1.5,L4:2.0,Entity:0.3};
    AN.forEach(n=>{
      const t=tP(n);
      const ang=t*Math.PI*4+(lAng[n.type]||0);
      const r=2+t*10;
      p[n.id]=new THREE.Vector3(Math.cos(ang)*r, lY[n.type]||0, Math.sin(ang)*r);
    });
  }
  return p;
}

// === NODE DRAG + CAMERA ORBIT ===
// Left-click+drag on node = move node. Left-click+drag on empty = orbit. Right-click+drag = orbit always.
// Click (no drag) on node = select/detail.
let dr=0,px=0,py=0,ca={x:0,y:.12},cd=30,ct=new THREE.Vector3(0,0,0);
let dragNode=null,dragPlane=new THREE.Plane(),dragOffset=new THREE.Vector3(),dragMoved=false;
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const customPos={}; // {layout: {nodeId: {x,y,z}}}

function toMouse(e){mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1}
function uc(){cam.position.x=ct.x+Math.sin(ca.x)*Math.cos(ca.y)*cd;cam.position.y=ct.y+Math.sin(ca.y)*cd;cam.position.z=ct.z+Math.cos(ca.x)*Math.cos(ca.y)*cd;cam.lookAt(ct)}

ren.domElement.addEventListener('mousedown',e=>{
  px=e.clientX;py=e.clientY;dragMoved=false;
  // Right-click always orbits
  if(e.button===2){dr=2;e.preventDefault();return}
  if(e.button!==0)return;
  // Left-click: check if we hit a node
  toMouse(e);raycaster.setFromCamera(mouse,cam);
  const hits=raycaster.intersectObjects(MS.filter(x=>x.visible));
  if(hits.length>0){
    // Start dragging this node
    dragNode=hits[0].object;
    dr=3; // 3 = node drag mode
    // Create a plane perpendicular to camera through the node
    const camDir=new THREE.Vector3();cam.getWorldDirection(camDir);
    dragPlane.setFromNormalAndCoplanarPoint(camDir,dragNode.position);
    // Calculate offset so node doesn't jump to cursor
    const intersection=new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane,intersection);
    dragOffset.subVectors(dragNode.position,intersection);
    ren.domElement.style.cursor='grabbing';
  } else {
    dr=1; // 1 = orbit mode
  }
});

ren.domElement.addEventListener('mousemove',e=>{
  const dx=e.clientX-px,dy=e.clientY-py;
  if(Math.abs(dx)>2||Math.abs(dy)>2)dragMoved=true;

  if(dr===1||dr===2){
    // Orbit camera
    ca.x-=(e.clientX-px)*.005;
    ca.y+=(e.clientY-py)*.005;
    ca.y=Math.max(-1.2,Math.min(1.2,ca.y));
    px=e.clientX;py=e.clientY;
    uc();
  } else if(dr===3&&dragNode){
    // Drag node on camera-perpendicular plane
    toMouse(e);raycaster.setFromCamera(mouse,cam);
    const intersection=new THREE.Vector3();
    if(raycaster.ray.intersectPlane(dragPlane,intersection)){
      dragNode.position.copy(intersection.add(dragOffset));
      ue(); // update edges
    }
    px=e.clientX;py=e.clientY;
  }

  // Hover tooltip (only when not dragging)
  if(!dr){
    toMouse(e);raycaster.setFromCamera(mouse,cam);
    const h=raycaster.intersectObjects(MS.filter(x=>x.visible));
    const tip=document.getElementById('tip');
    if(h.length){
      const n=h[0].object.userData;
      ren.domElement.style.cursor='grab';
      const lb=n.name||n.title||n.statement||n.description||n.object_value||n.content?.slice(0,60)||n.id;
      tip.innerHTML=`<div class="tty" style="color:${CC[n.type].h}">${n.type==='Entity'?'CHARACTER':n.type}</div>${lb}`;
      tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-8)+'px';
      tip.classList.add('v');
    } else {
      ren.domElement.style.cursor='default';
      tip.classList.remove('v');
    }
  } else {
    document.getElementById('tip').classList.remove('v');
  }
});

ren.domElement.addEventListener('mouseup',e=>{
  if(dr===3&&dragNode){
    // Save this node's new position into customPos
    if(dragMoved){
      if(!customPos[lay])customPos[lay]={};
      const pos=dragNode.position;
      customPos[lay][dragNode.userData.id]={x:pos.x,y:pos.y,z:pos.z};
      showPosStatus('Position changed — save to keep');
    }
    ren.domElement.style.cursor='grab';
  }
  // If it was a click (not a drag) on a node, select it
  if(!dragMoved&&(dr===1||dr===3)){
    toMouse(e);raycaster.setFromCamera(mouse,cam);
    const h=raycaster.intersectObjects(MS.filter(x=>x.visible));
    if(h.length)sn(h[0].object.userData);
  }
  dr=0;dragNode=null;
});

// === PERSISTENT STORAGE ===
function showPosStatus(msg){
  const el=document.getElementById('posStatus');
  el.textContent=msg;
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.textContent=''},4000);
}

async function savePositions(){
  // Merge current mesh positions into customPos for this layout
  if(!customPos[lay])customPos[lay]={};
  MS.forEach(m=>{
    const pos=m.position;
    customPos[lay][m.userData.id]={x:pos.x,y:pos.y,z:pos.z};
  });
  try{
    await window.storage.set('trimemory-pos-'+lay, JSON.stringify(customPos[lay]));
    showPosStatus('Saved ✓');
  }catch(err){
    // Fallback: use in-memory only
    showPosStatus('Saved (session only)');
  }
}

async function loadPositions(layout){
  try{
    const result=await window.storage.get('trimemory-pos-'+layout);
    if(result&&result.value){
      customPos[layout]=JSON.parse(result.value);
      return true;
    }
  }catch(err){}
  return false;
}

async function resetPositions(){
  customPos[lay]={};
  try{await window.storage.delete('trimemory-pos-'+lay)}catch(err){}
  // Re-layout from scratch
  const ps=gp(lay);
  const st={};MS.forEach(m=>{st[m.userData.id]=m.position.clone()});
  const dur=800,t0=performance.now();
  function s(now){
    const t=Math.min((now-t0)/dur,1),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    MS.forEach(m=>{const id=m.userData.id;if(st[id]&&ps[id])m.position.lerpVectors(st[id],ps[id],e)});
    ue();if(t>=1)updSpine();if(t<1)requestAnimationFrame(s);
  }
  requestAnimationFrame(s);
  showPosStatus('Reset to default');
}

function applySavedPositions(layout){

  if(!saved)return;
  MS.forEach(m=>{
    const sp=saved[m.userData.id];
    if(sp)m.position.set(sp.x,sp.y,sp.z);
  });
  ue();
}
